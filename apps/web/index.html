<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" />
    <style>
      @import "/src/assets/global.css";
    </style>
    <script>
      ;(() => {
        let preference = "system"
        try {
          preference = localStorage.getItem("theme")
        } catch {
          // 保存設定を読めない場合もシステム配色で表示する。
        }
        const dark =
          preference === "dark" ||
          (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.querySelector('meta[name="theme-color"]').content = getComputedStyle(
          document.documentElement,
        )
          .getPropertyValue("--color-background")
          .trim()
      })()
    </script>
    <!-- page-metadata:start -->
    <!-- page-metadata:end -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Burneto" />
    <meta property="og:image" content="https://burneto.com/ogp.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Burnetoの紫の炎と紙幣のアイコン。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://burneto.com/ogp.png" />
    <meta name="twitter:image:alt" content="Burnetoの紫の炎と紙幣のアイコン。" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
