id = "aidd-phase-execution-v1"
version = 1

[goal_lifecycle]
owner = "parent"
tools = ["get_goal", "create_goal", "update_goal"]

[goal_setting]
owner = "parent"
entrypoint = "goal-setting"

[delegation]
phases = ["Requirements", "Design", "Build"]
allowed_responsibilities = ["phase_outputs", "verification_evidence"]
forbidden_responsibilities = [
  "goal_lifecycle",
  "goal_setting",
  "phase_transition",
  "learn",
  "delegation",
]

[agent_instructions]
"aidd-requirements-design" = """
You execute exactly one active AIDD Requirements or Design Goal prepared by the parent orchestrator.

Before any other action, read and obey canonical contract `aidd-phase-execution-v1` at `.agents/skills/aidd-cycle/references/phase-execution-contract.toml`. Apply its phase-agent responsibilities and forbidden capabilities to the entire assignment.

The parent orchestrator has already set and identified the active Goal in the assignment message. Require the assignment message to contain a matching phase, cycle, Goal identity, and Context Packet; if any is missing or inconsistent, return a stop report without changing Goal state. Read the repository AIDD workflow, the supplied Context Packet, the selected rule documents, and the applicable artifact-validation instructions before editing.

Complete only the active phase, including its owned artifacts, required gates, and completion evidence. Do not create, complete, block, or otherwise update a Goal. Preserve every upstream read-only boundary and Stop condition.

Stay within the active Goal and return concise artifact and validation evidence to the parent orchestrator, which independently verifies the evidence and owns the Goal lifecycle decision.
"""
"aidd-build" = """
You execute exactly one active AIDD Build Goal prepared by the parent orchestrator.

Before any other action, read and obey canonical contract `aidd-phase-execution-v1` at `.agents/skills/aidd-cycle/references/phase-execution-contract.toml`. Apply its phase-agent responsibilities and forbidden capabilities to the entire assignment.

The parent orchestrator has already set and identified the active Build Goal in the assignment message. Require the assignment message to contain a matching Build phase, cycle, Goal identity, and Context Packet; if any is missing or inconsistent, return a stop report without changing Goal state. Read the repository AIDD workflow, the supplied Context Packet, the selected rule documents, the Design completion receipt, and the Build artifact-validation instructions before editing.

Complete only the active Build Goal, including implementation, affected verification, the final Build Entry gate, and completion evidence. Do not create, complete, block, or otherwise update a Goal. Preserve every upstream artifact and receipt as read-only and obey all Stop conditions.

Stay within the active Goal and return concise implementation, verification, and gate evidence to the parent orchestrator, which independently verifies the evidence and owns the Goal lifecycle decision.
"""

[agent_instruction_forbidden_identifiers]
"aidd-requirements-design" = [
  "get_goal",
  "create_goal",
  "update_goal",
  "goal-setting",
  "build",
  "ship",
  "learn",
  "commit",
  "push",
  "pull request",
  "pr",
  "spawn_agent",
  "delegate",
  "delegated",
  "delegation",
  "later phase",
  "next phase",
]
"aidd-build" = [
  "get_goal",
  "create_goal",
  "update_goal",
  "goal-setting",
  "ship",
  "learn",
  "commit",
  "push",
  "pull request",
  "pr",
  "spawn_agent",
  "delegate",
  "delegated",
  "delegation",
  "later phase",
  "next phase",
]

[[phases]]
name = "Requirements"
executor = "aidd-requirements-design"
configuration = ".codex/agents/aidd-requirements-design.toml"
delegated = true
goal_access = "forbidden"

[[phases]]
name = "Design"
executor = "aidd-requirements-design"
configuration = ".codex/agents/aidd-requirements-design.toml"
delegated = true
goal_access = "forbidden"

[[phases]]
name = "Build"
executor = "aidd-build"
configuration = ".codex/agents/aidd-build.toml"
delegated = true
goal_access = "forbidden"

[[phases]]
name = "Ship"
executor = "parent agent"
configuration = "current selection"
delegated = false
goal_access = "owner"
