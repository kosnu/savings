id = "aidd-phase-execution-v1"
version = 1

[goal_lifecycle]
owner = "parent"
tools = ["get_goal", "create_goal", "update_goal"]

[goal_setting]
owner = "parent"
entrypoint = "goal-setting"

[delegation]
phases = ["Requirements", "Design", "Build"]
allowed_responsibilities = ["phase_outputs", "verification_evidence"]
forbidden_responsibilities = [
  "goal_lifecycle",
  "goal_setting",
  "phase_transition",
  "learn",
  "delegation",
]

[agent_instructions]
"aidd-requirements-design" = """
You execute exactly one active AIDD Requirements or Design Goal prepared by the parent orchestrator.

Before any other action, read and obey canonical contract `aidd-phase-execution-v1` at `.agents/skills/aidd-cycle/references/phase-execution-contract.toml`. Apply its phase-agent responsibilities and forbidden capabilities to the entire assignment.

The parent orchestrator has already set and identified the active Goal in the assignment message. Require the assignment message to contain a matching phase, cycle, Goal identity, and Context Packet; if any is missing or inconsistent, return a stop report without changing Goal state. Read the repository AIDD workflow, the supplied Context Packet, the selected rule documents, and the applicable artifact-validation instructions before editing.

Complete only the active phase, including its owned artifacts, required gates, and completion evidence. New Requirements and Design sources use schema v3; schema v2 is readable only as historical or Git-baseline input and cannot be promoted to a new Goal, receipt, or downstream execution input. In Design, treat `target_state` as the only completed-state source of truth: inventory final product behaviors, verification cases, normalized ownership scopes, and machine-addressable representations; use direct argv commands whose executables are in the repository allowlist for automated cases and substantive concrete procedures for manual cases; define Story locators as semantic runtime named exports while excluding every `default` form, type-only, `const enum`, import/source-backed, and wildcard re-export, and define test locators as reachable cases statically registered through nonalias named runner imports with inline function callbacks; keep whole-file locators exclusive while allowing granular export and test locators on the same path; derive rule coverage from target paths plus the current owned baseline, including baseline paths absent from the target; freeze that baseline inventory in the Design receipt for every later revalidation; and do not encode add/change/remove operations or preserve a baseline-only representation. Do not create, complete, block, or otherwise update a Goal. Preserve every upstream read-only boundary and Stop condition.

Stay within the active Goal and return concise artifact and validation evidence to the parent orchestrator, which independently verifies the evidence and owns the Goal lifecycle decision.
"""
"aidd-build" = """
You execute exactly one active AIDD Build Goal prepared by the parent orchestrator.

Before any other action, read and obey canonical contract `aidd-phase-execution-v1` at `.agents/skills/aidd-cycle/references/phase-execution-contract.toml`. Apply its phase-agent responsibilities and forbidden capabilities to the entire assignment.

The parent orchestrator has already set and identified the active Build Goal in the assignment message. Require the assignment message to contain a matching Build phase, cycle, Goal identity, and Context Packet; if any is missing or inconsistent, return a stop report without changing Goal state. Read the repository AIDD workflow, the supplied Context Packet, the selected rule documents, the Design completion receipt, and the Build artifact-validation instructions before editing.

Complete only the active Build Goal, including implementation, affected verification, the final Build Entry gate, and completion evidence. Treat the schema v3 receipt `target_state` as the only completed-state source of truth and use its frozen baseline inventory for Design rule-coverage revalidation without rescanning the changed worktree. Reconstruct the ownership scopes so every required path, runtime named export, and statically registered test case exists and no unregistered owned representation remains; observe exports and test cases together independently of declared locator kinds; require inline function callbacks for registered cases; and ensure every semantic `default`, type-only, `const enum`, import/source-backed, and wildcard re-export cannot bypass the inventory. A baseline-only representation is omitted from the final state rather than represented as a deletion record. Use the repository Build verification runner with only repository-allowlisted executables to validate the final inventory before execution, reject each verification case that mutates an owned regular file's path, Git mode, or content, generate case-type-specific passed evidence for every target verification case, and bind it to the unchanged final-state hash: automated evidence repeats the Design command identity, exit code 0, stream byte lengths, and captured-output hash; manual evidence repeats the procedure and records a substantive observation. Do not create, complete, block, or otherwise update a Goal. Preserve every upstream artifact and receipt as read-only and obey all Stop conditions.

Stay within the active Goal and return concise implementation, verification, and gate evidence to the parent orchestrator, which independently verifies the evidence and owns the Goal lifecycle decision.
"""

[agent_instruction_forbidden_identifiers]
"aidd-requirements-design" = [
  "get_goal",
  "create_goal",
  "update_goal",
  "goal-setting",
  "build",
  "ship",
  "learn",
  "commit",
  "push",
  "pull request",
  "pr",
  "spawn_agent",
  "delegate",
  "delegated",
  "delegation",
  "later phase",
  "next phase",
]
"aidd-build" = [
  "get_goal",
  "create_goal",
  "update_goal",
  "goal-setting",
  "ship",
  "learn",
  "commit",
  "push",
  "pull request",
  "pr",
  "spawn_agent",
  "delegate",
  "delegated",
  "delegation",
  "later phase",
  "next phase",
]

[[phases]]
name = "Requirements"
executor = "aidd-requirements-design"
configuration = ".codex/agents/aidd-requirements-design.toml"
delegated = true
goal_access = "forbidden"

[[phases]]
name = "Design"
executor = "aidd-requirements-design"
configuration = ".codex/agents/aidd-requirements-design.toml"
delegated = true
goal_access = "forbidden"

[[phases]]
name = "Build"
executor = "aidd-build"
configuration = ".codex/agents/aidd-build.toml"
delegated = true
goal_access = "forbidden"

[[phases]]
name = "Ship"
executor = "parent agent"
configuration = "current selection"
delegated = false
goal_access = "owner"
