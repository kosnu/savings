name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "公開済み正式 Release の ID（再実行用）"
        required: true
        type: string
      expected_sha:
        description: "Release 公開時の完全な commit SHA"
        required: true
        type: string

run-name: Production Release ${{ inputs.release_id }} @ ${{ inputs.expected_sha }}

permissions: {}

# DB と Web を含む実行全体を直列化し、実行中の migration を取り消さない。
concurrency:
  group: burneto-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      url: ${{ steps.release.outputs.url }}
    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate published release
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          script: |
            const { resolveRelease } = await import(`${process.env.GITHUB_WORKSPACE}/tools/production-release/release.mjs`);
            const release = await resolveRelease({ github, context, releaseId: process.env.RELEASE_ID, expectedSha: process.env.EXPECTED_SHA });
            core.setOutput('sha', release.sha);
            core.setOutput('url', release.url);

  # --- Backend (Supabase) のデプロイ ---
  deploy-api:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ needs.release.outputs.url }}
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      AUTH_SITE_URL: ${{ secrets.AUTH_SITE_URL }}
      AUTH_REDIRECT_URL: ${{ secrets.AUTH_REDIRECT_URL }}
      SUPABASE_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_GOOGLE_CLIENT_ID }}
      SUPABASE_GOOGLE_CLIENT_SECRET: ${{ secrets.SUPABASE_GOOGLE_CLIENT_SECRET }}
      SUPABASE_GOOGLE_REDIRECT_URL: ${{ secrets.SUPABASE_GOOGLE_REDIRECT_URL }}
      SUPABASE_GOOGLE_SKIP_NONCE_CHECK: ${{ secrets.SUPABASE_GOOGLE_SKIP_NONCE_CHECK }}
    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck release after environment approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_SHA: ${{ needs.release.outputs.sha }}
        with:
          script: |
            const { resolveRelease } = await import(`${process.env.GITHUB_WORKSPACE}/tools/production-release/release.mjs`);
            await resolveRelease({ github, context, releaseId: process.env.RELEASE_ID, expectedSha: process.env.EXPECTED_SHA });
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.1

      - name: Link Supabase Project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        working-directory: apps/api

      - name: Push Database Migrations
        run: supabase db push --linked --yes
        working-directory: apps/api

  # --- Frontend (React + Vite) のデプロイ ---
  deploy-web:
    needs: [release, deploy-api]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ needs.release.outputs.url }}
    permissions:
      contents: read
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck release after environment approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_SHA: ${{ needs.release.outputs.sha }}
        with:
          script: |
            const { resolveRelease } = await import(`${process.env.GITHUB_WORKSPACE}/tools/production-release/release.mjs`);
            await resolveRelease({ github, context, releaseId: process.env.RELEASE_ID, expectedSha: process.env.EXPECTED_SHA });
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          package-manager-cache: false

      - name: Install deps and build
        run: |
          : "${SENTRY_RELEASE:?SENTRY_RELEASE が必要です}"
          : "${VITE_SENTRY_DSN:?VITE_SENTRY_DSN が必要です}"
          : "${VITE_SENTRY_ENVIRONMENT:?VITE_SENTRY_ENVIRONMENT が必要です}"
          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN が必要です}"
          : "${SENTRY_ORG:?SENTRY_ORG が必要です}"
          : "${SENTRY_PROJECT:?SENTRY_PROJECT が必要です}"
          pnpm ci
          pnpm run web:build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ needs.release.outputs.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ secrets.VITE_SENTRY_ENVIRONMENT }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Validate Workers Static Assets
        run: pnpm --filter web exec cf deploy --prebuilt --mode production --dry-run

      - name: Deploy to Workers Static Assets
        run: pnpm --filter web exec cf deploy --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  report:
    if: always() && needs.release.result == 'success'
    needs: [release, deploy-api, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 書き込み token を配信対象のコードへ渡さず main の補助コードだけを実行する。
      - name: Checkout deployment helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report deployment result on release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_SHA: ${{ needs.release.outputs.sha }}
          API_RESULT: ${{ needs.deploy-api.result }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
        with:
          script: |
            const { reportRelease } = await import(`${process.env.GITHUB_WORKSPACE}/tools/production-release/release.mjs`);
            await reportRelease({ github, context, core, releaseId: process.env.RELEASE_ID, expectedSha: process.env.EXPECTED_SHA, apiResult: process.env.API_RESULT, webResult: process.env.WEB_RESULT, runAttempt: process.env.GITHUB_RUN_ATTEMPT });
