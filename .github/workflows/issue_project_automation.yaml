name: Initialize issue automation field

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: issue-project-automation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  initialize:
    if: github.repository == 'kosnu/savings'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize Automation Issue Field
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: await require('./tools/github-actions/issue-project-automation.cjs')({github, context, core})
