name: Deploy Dev Preview

# 同一repositoryのPRだけを受け付け、固定SHAをdevelopment Environmentで配信する。
on:
  pull_request:
    branches: [main]
    types: [labeled]
  # 競合PRでも終了通知を受け取る。PRコードの実行・配信には使わない。
  pull_request_target: # zizmor: ignore[dangerous-triggers] closed専用。配信を禁止し、baseの削除補助コードだけを実行する
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "配信する同一リポジトリの open PR 番号"
        required: true
        type: string

run-name: Dev Preview PR ${{ github.event.pull_request.number || inputs.pr_number }} @ ${{ github.event.pull_request.head.sha || 'resolve-current-head' }}

permissions: {}

# 配信・終了通知・配信後の削除を同じ PR で直列化する。実行中は中断しない。
concurrency:
  group: dev-preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  # Prod の deploy-web を基準に、PR 選択から配信まで同じ job で実行する。
  deploy-web:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'preview' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      url: ${{ steps.deployment.outputs.url }}
      description: ${{ steps.deployment.outputs.description }}
      completed_at: ${{ steps.deployment.outputs.completed_at }}
    steps:
      - name: Checkout trusted deployment helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Resolve selected PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node tools/dev-preview/authorize.mjs

      # 既存 PR が古い補助コードを持っていても、main の契約で検証・通知する。
      - name: Preserve trusted Preview helpers
        run: |
          mkdir -p "$RUNNER_TEMP/preview-control"
          cp tools/dev-preview/preview.mjs tools/dev-preview/report.mjs "$RUNNER_TEMP/preview-control/"

      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm ci

      - name: Build Dev Preview
        id: preview
        env:
          PREVIEW_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          NODE_ENV: production
          CLOUDFLARE_PREVIEW_BUILD: "true"
          CF_SEND_TELEMETRY: "false"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ secrets.VITE_SENTRY_ENVIRONMENT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ steps.pr.outputs.sha }}
        run: |
          : "${SENTRY_RELEASE:?SENTRY_RELEASE が必要です}"
          : "${VITE_SENTRY_DSN:?VITE_SENTRY_DSN が必要です}"
          : "${VITE_SENTRY_ENVIRONMENT:?VITE_SENTRY_ENVIRONMENT が必要です}"
          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN が必要です}"
          : "${SENTRY_ORG:?SENTRY_ORG が必要です}"
          : "${SENTRY_PROJECT:?SENTRY_PROJECT が必要です}"
          preview_name=$(node "$RUNNER_TEMP/preview-control/preview.mjs" name "$PREVIEW_BRANCH" "$PR_NUMBER")
          echo "name=$preview_name" >> "$GITHUB_OUTPUT"
          pnpm run web:build --mode development

      - name: Validate Workers Static Assets
        run: node "$RUNNER_TEMP/preview-control/preview.mjs" check-build

      - name: Deploy Dev Preview
        id: deployment
        shell: bash
        env:
          PREVIEW_NAME: ${{ steps.preview.outputs.name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SEND_TELEMETRY: "false"
          DEPLOYED_SHA: ${{ steps.pr.outputs.sha }}
          PREVIEW_BRANCH: ${{ steps.pr.outputs.branch }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          pnpm --filter web exec cf previews deploy "$PREVIEW_NAME" --prebuilt --mode development > "$RUNNER_TEMP/preview.json"
          test -s "$RUNNER_TEMP/preview.json"
          node "$RUNNER_TEMP/preview-control/report.mjs" "$RUNNER_TEMP/preview.json"

  cleanup:
    name: Check PR state and delete closed Dev Preview
    needs: deploy-web
    if: >-
      always() &&
      (needs.deploy-web.result != 'skipped' ||
       (github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main'))
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      pull-requests: read
    outputs:
      closed: ${{ steps.state.outputs.closed }}
    steps:
      # 配信 job の filesystem / outputs は削除コードに使わない。
      - name: Checkout trusted cleanup helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Check current PR state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node tools/dev-preview/lifecycle.mjs reconcile
      - name: Delete only the selected native Preview
        if: steps.state.outputs.closed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PREVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # 手動実行では event に branch がないため、信頼済みの GitHub 照会で補う。
          if [ -z "$PREVIEW_BRANCH" ]; then
            PREVIEW_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')
            export PREVIEW_BRANCH
          fi
          node tools/dev-preview/cleanup.mjs

  report:
    name: Publish Dev Preview URL
    needs: [deploy-web, cleanup]
    if: needs.cleanup.outputs.closed == 'false'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      # PR コードを checkout / 実行せず、配信成功時だけ検証済み SHA へ登録する。
      - name: Link the latest successful deployment from PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ needs.deploy-web.outputs.sha }}
          PREVIEW_URL: ${{ needs.deploy-web.outputs.url }}
          DESCRIPTION: ${{ needs.deploy-web.outputs.description }}
          COMPLETED_AT: ${{ needs.deploy-web.outputs.completed_at }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$PREVIEW_URL"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$COMPLETED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]]
          context="Dev Preview URL / PR #$PR_NUMBER"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOYED_SHA/status?per_page=100" \
            --jq ".statuses[] | select(.context == \"$context\") | .description")
          # 古い配信の通知jobだけを再試行しても、新しい成功結果を上書きしない。
          if [[ "${latest:0:24}" > "$COMPLETED_AT" ]]; then
            echo "A newer successful deployment is already linked."
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$DEPLOYED_SHA" \
            -f state=success -f context="$context" \
            -f description="$DESCRIPTION" -f target_url="$PREVIEW_URL"
