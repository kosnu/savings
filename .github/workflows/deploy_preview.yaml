name: Deploy Dev Preview

on:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "配信する同一リポジトリの open PR 番号"
        required: true
        type: string

run-name: Dev Preview PR ${{ github.event.pull_request.number || inputs.pr_number }} @ ${{ github.event.pull_request.head.sha || 'resolve-current-head' }}

permissions: {}

# 同じ PR の配信を直列化する。別 PR は併存できる。
concurrency:
  group: dev-preview-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'preview' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      actions: read
      contents: read
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Checkout requested gate code without deployment secrets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate request and existing approval protection
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/dev-preview/authorize.mjs

  deploy:
    name: Approve Dev Preview ${{ needs.resolve.outputs.sha }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      # 承認待ちの間の head 更新、ラベル撤回、保護設定変更も拒否する。
      - name: Revalidate after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          EXPECTED_BRANCH: ${{ needs.resolve.outputs.branch }}
        run: node tools/dev-preview/authorize.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.7.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm ci

      - name: Build and deploy Dev Preview
        env:
          PREVIEW_BRANCH: ${{ needs.resolve.outputs.branch }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/dev-preview/deploy.mjs "$PREVIEW_BRANCH"
