name: AIDD Checker CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: aidd-checker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/aidd/checker/go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l tools/aidd/checker)"
      - name: Vet
        run: go -C tools/aidd/checker vet ./...
      - name: Test Core boundaries and lifecycle
        run: go -C tools/aidd/checker test -count=1 ./...
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "package.json"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm ci

      - name: Verify shared Git gate
        run: python3 -B -m unittest -v tools.aidd.tests.test_shared_gate
      - name: Preserve accepted ADR history
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: python3 -B docs/harness/scripts/validate_accepted_adrs.py --repo-root . --base-ref "origin/$BASE_BRANCH"
      - name: Identify authenticated automated dependency changes
        id: automation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "verified=false" >> "$GITHUB_OUTPUT"
          if [ "$PR_AUTHOR" = 'renovate[bot]' ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" > "$RUNNER_TEMP/pr-commits.json"
            if jq -s -e 'add | length > 0 and all(.[]; .author.login == "renovate[bot]" and .committer.login == "web-flow" and .commit.verification.verified == true and .commit.verification.reason == "valid")' "$RUNNER_TEMP/pr-commits.json"; then
              echo "verified=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Validate v4 records and rule graph
        run: go -C tools/aidd/checker run ./cmd/aidd-checker --root "$GITHUB_WORKSPACE" check-all
      - name: Validate v4 delivery evidence and rule graph
        if: steps.automation.outputs.verified != 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: go -C tools/aidd/checker run ./cmd/aidd-checker --root "$GITHUB_WORKSPACE" check-all --base "$PR_BASE_SHA"

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/aidd/checker/go.mod
          cache: false
      - name: Test merged Core
        run: go -C tools/aidd/checker test -count=1 ./...
      - name: Validate record integrity in merge result
        run: go -C tools/aidd/checker run ./cmd/aidd-checker --root "$GITHUB_WORKSPACE" check-all

  verify:
    needs: [candidate, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require candidate and integration success
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$CANDIDATE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
