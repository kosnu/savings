name: Deploy Dev Database

on:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "DB変更を検証する同一repositoryのopen PR番号"
        required: true
        type: string

run-name: Dev DB PR ${{ github.event.pull_request.number || inputs.pr_number }} @ ${{ github.event.pull_request.head.sha || 'resolve-current-head' }}
permissions: {}

# 全ブランチが一つの共有DBを使う。承認待ちを含めて直列化する。
concurrency:
  group: burneto-shared-dev-database
  cancel-in-progress: false

env:
  DEPLOYMENT_KIND: database

jobs:
  resolve:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
       github.event.label.name == 'dev-db' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/dev-preview/authorize.mjs

  plan:
    name: Read DB plan for ${{ needs.resolve.outputs.branch }} @ ${{ needs.resolve.outputs.sha }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: development-database
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Revalidate approved source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          EXPECTED_BRANCH: ${{ needs.resolve.outputs.branch }}
        run: node tools/dev-preview/authorize.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Read history and publish migration plan
        id: plan
        env:
          DB_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node tools/dev-db/deploy.mjs plan

  apply:
    name: Approve DB plan ${{ needs.plan.outputs.digest }} @ ${{ needs.resolve.outputs.sha }}
    needs: [resolve, plan]
    runs-on: ubuntu-latest
    environment: development-database
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Revalidate after migration approval
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          EXPECTED_BRANCH: ${{ needs.resolve.outputs.branch }}
        run: node tools/dev-preview/authorize.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: pnpm ci
      - name: Verify unchanged plan and apply pending migrations
        env:
          DB_EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          DB_PLAN_DIGEST: ${{ needs.plan.outputs.digest }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node tools/dev-db/deploy.mjs apply
