name: Frontend CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend_ci.yaml"
      - ".github/actions/setup-playwright/action.yaml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 検証対象のPR番号
        required: true
        type: string
      expected_head:
        description: 検証対象のPR head SHA
        required: true
        type: string
      sync_run_id:
        description: Vite+同期workflowのrun ID
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      author: ${{ steps.pr.outputs.author }}
    steps:
      - name: Resolve and validate PR context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
          SYNC_RUN_ID: ${{ inputs.sync_run_id }}
        run: |
          set -euo pipefail
          [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$SYNC_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
            test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR" > "$RUNNER_TEMP/pr.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$EXPECTED_HEAD" '
            .state == "open" and .head.repo != null and
            .base.repo.full_name == $repo and .base.ref == "main" and .head.sha == $head
          ' "$RUNNER_TEMP/pr.json"
          jq -r '"number=\(.number)", "head=\(.head.sha)", "base=\(.base.sha)", "base_ref=\(.base.ref)", "author=\(.user.login)"' "$RUNNER_TEMP/pr.json" >> "$GITHUB_OUTPUT"

  lint-format:
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ needs.context.outputs.number }}/head
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare PR merge result
        env:
          PR_BASE_SHA: ${{ needs.context.outputs.base }}
          PR_HEAD_SHA: ${{ needs.context.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin "$PR_BASE_SHA"
          git -c user.name=github-actions -c user.email=github-actions@github.com merge --no-commit --no-ff "$PR_BASE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm ci

      - name: Oxc lint
        run: pnpm run web:lint

      - name: Oxc format check
        run: pnpm run web:format-check

  typecheck:
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ needs.context.outputs.number }}/head
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare PR merge result
        env:
          PR_BASE_SHA: ${{ needs.context.outputs.base }}
          PR_HEAD_SHA: ${{ needs.context.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin "$PR_BASE_SHA"
          git -c user.name=github-actions -c user.email=github-actions@github.com merge --no-commit --no-ff "$PR_BASE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm ci

      - name: Typecheck
        run: pnpm run web:typecheck

      - name: Build Workers Static Assets
        run: pnpm run web:build
        env:
          CF_SEND_TELEMETRY: "false"

      - name: Validate Workers Static Assets
        run: pnpm --filter web exec cf deploy --prebuilt --mode production --dry-run
        env:
          CF_SEND_TELEMETRY: "false"

  unit-test:
    needs: context
    name: unit-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ needs.context.outputs.number }}/head
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare PR merge result
        env:
          PR_BASE_SHA: ${{ needs.context.outputs.base }}
          PR_HEAD_SHA: ${{ needs.context.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin "$PR_BASE_SHA"
          git -c user.name=github-actions -c user.email=github-actions@github.com merge --no-commit --no-ff "$PR_BASE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm ci

      - name: Unit and integration tests
        run: pnpm --filter web exec vp test run --project unit --project integration --shard=${{ matrix.shard }} --reporter=dot --silent
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: test-dummy-key

  storybook-test:
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ needs.context.outputs.number }}/head
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare PR merge result
        env:
          PR_BASE_SHA: ${{ needs.context.outputs.base }}
          PR_HEAD_SHA: ${{ needs.context.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin "$PR_BASE_SHA"
          git -c user.name=github-actions -c user.email=github-actions@github.com merge --no-commit --no-ff "$PR_BASE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm ci

      - name: Install Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Storybook browser tests
        run: pnpm --filter web test:storybook --reporter=dot --silent
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: test-dummy-key

  report-dispatched-result:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [context, lint-format, typecheck, unit-test, storybook-test]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report dispatched CI on the PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
          CONTEXT_HEAD: ${{ needs.context.outputs.head }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          if [ -n "$CONTEXT_HEAD" ]; then
            test "$CONTEXT_HEAD" = "$EXPECTED_HEAD"
          fi
          state=failure
          if jq -e 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"; then
            state=success
          fi
          # dispatchのjob checkはPRに評価されないため、検証対象SHAへstatusを返す。
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD" \
            -f state="$state" -f context="vite-plus/frontend-ci" \
            -f description="Dispatched CI: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$state" = success
