name: Dev Preview CI

on:
  pull_request:
    paths:
      - "tools/dev-preview/**"
      - "tools/supabase-check/**"
      - ".github/workflows/deploy_dev_database.yaml"
      - "apps/web/cloudflare.config.ts"
      - ".github/workflows/deploy_preview.yaml"
      - ".github/workflows/dev_preview_ci.yaml"
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: pnpm ci
      - run: node --test tools/dev-preview/*.test.mjs
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/supabase-check/go.mod
          cache: false
      - name: Build Preview without deployment credentials
        env:
          NODE_ENV: production
          CLOUDFLARE_VITE_PREVIEW_BUILD: "true"
          CF_SEND_TELEMETRY: "false"
          VITE_SENTRY_DSN: https://public@sentry.invalid/1
          VITE_SENTRY_ENVIRONMENT: development
          VITE_SUPABASE_URL: https://ufekmuxkmodwydxmdbln.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_fixture
        run: go -C tools/supabase-check run . preview-build --root "$GITHUB_WORKSPACE"
