packages:
  - apps/*
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  msw: true
  sharp: true
  supabase: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
minimumReleaseAge: 10080
overrides:
  eslint: "10.13.0"
  undici@>=7.0.0 <7.24.0: "^8.0.0"
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vite-plus
    - vitest
  allowedVersions:
    vite: "*"
    vite-plus: "*"
    vitest: "*"
savePrefix: ""
minimumReleaseAgeExclude:
  # Renovate security update: esbuild@0.28.1
  - esbuild@0.28.1
